<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面試康樂棋 - 專業背景版</title>
    <style>
        /* 背景圖片設定 */
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 10px;
            background: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), 
                        url('https://images.unsplash.com'); /* 這裡使用了一張摩天大樓/街道的圖片 */
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        h1 { color: #2c3e50; font-size: 28px; text-shadow: 1px 1px 2px white; margin: 15px 0; }
        
        #game-container { max-width: 800px; margin: auto; }
        
        /* 棋盤格子優化 */
        #board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
        .cell { 
            height: 115px; border: 4px solid #bdc3c7; background: rgba(255, 255, 255, 0.95); 
            border-radius: 18px; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .cell-num { position: absolute; top: 5px; left: 10px; font-size: 16px; color: #7f8c8d; font-weight: bold; }
        .active { border-color: #f1c40f; background-color: #fffde7; box-shadow: 0 0 25px #f1c40f; z-index: 5; transform: scale(1.02); }
        
        /* 事件顏色 */
        .event-good { border-color: #3498db; background-color: #ebf5fb; }
        .event-bad { border-color: #e74c3c; background-color: #fdedec; }
        
        /* 角色與骰子 */
        #player { font-size: 55px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2)); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        #dice-btn { 
            padding: 20px 50px; font-size: 30px; cursor: pointer; 
            background: #27ae60; color: white; border: none; border-radius: 60px; 
            box-shadow: 0 8px #1e8449; transition: 0.1s;
        }
        #dice-btn:active { box-shadow: 0 4px #1e8449; transform: translateY(4px); }
        #dice-btn:disabled { background: #bdc3c7; box-shadow: none; }

        #msg { 
            font-size: 26px; margin: 25px auto; min-height: 60px; color: #2c3e50; font-weight: bold; 
            max-width: 650px; padding: 15px; border-radius: 15px; background: rgba(255, 255, 255, 0.9); 
            border: 3px solid #3498db; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .icon { font-size: 45px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>🏙️ 面試大冒險 (康樂棋) 🏢</h1>

    <div id="game-container">
        <div id="board"></div>
    </div>

    <button id="dice-btn" onclick="rollDice()">🎲 擲骰子</button>
    <div id="msg">請點擊綠色按鈕開始面試之旅！</div>

    <script>
        const rawData = [
            { label: "起點", icon: "🏠" },
            { label: "帶齊證件", icon: "🪪", effect: 1, msg: "好棒！帶齊證件，行快 1 格！" },
            { label: "", icon: "👣" },
            { label: "睇地圖", icon: "🗺️", effect: 1, msg: "識睇地圖，行快 1 格！" },
            { label: "", icon: "👣" },
            { label: "塞車", icon: "🚗", effect: -1, msg: "前面塞車，要退後 1 格。" },
            { label: "", icon: "👣" },
            { label: "早出發", icon: "☀️", effect: 2, msg: "提早出門，好準時，行快 2 格！" },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "漏帶相片", icon: "📸", effect: -2, msg: "唔記得帶相！要退後 2 格攞返。" },
            { label: "", icon: "👣" },
            { label: "整理衣服", icon: "👔", effect: 1, msg: "衣服整齊，面試加分！行快 1 格。" },
            { label: "", icon: "👣" },
            { label: "終點", icon: "🏢", isEnd: true }
        ];

        // S 型路徑順序
        const sCurveIndex = [0, 1, 2, 3, 4, 9, 8, 7, 6, 5, 10, 11, 12, 13, 14];

        let currentPos = 0;
        const boardEl = document.getElementById('board');
        const msgEl = document.getElementById('msg');
        const diceBtn = document.getElementById('dice-btn');

        function initBoard() {
            boardEl.innerHTML = '';
            sCurveIndex.forEach((dataIndex) => {
                const cell = rawData[dataIndex];
                const div = document.createElement('div');
                div.className = 'cell';
                if (cell.effect > 0) div.classList.add('event-good');
                if (cell.effect < 0) div.classList.add('event-bad');
                
                div.innerHTML = `
                    <div class="cell-num">${dataIndex + 1}</div>
                    <div class="icon">${cell.icon}</div>
                    <div style="font-size:15px; color:#34495e;">${cell.label}</div>
                `;
                
                if (dataIndex === currentPos) {
                    div.classList.add('active');
                    const player = document.createElement('div');
                    player.id = 'player';
                    player.innerText = '🙋‍♂️'; // 你也可以換成 🚶 或 🏃
                    div.appendChild(player);
                }
                boardEl.appendChild(div);
            });
        }

        function rollDice() {
            diceBtn.disabled = true;
            const steps = Math.floor(Math.random() * 3) + 1; 
            msgEl.innerText = `🎲 擲到 ${steps} 點！出發！`;
            
            let moveCount = 0;
            const moveInterval = setInterval(() => {
                if (moveCount < steps && currentPos < rawData.length - 1) {
                    currentPos++;
                    moveCount++;
                    initBoard();
                } else {
                    clearInterval(moveInterval);
                    checkEvent();
                }
            }, 700);
        }

        function checkEvent() {
            const cell = rawData[currentPos];
            if (cell.isEnd) {
                msgEl.innerHTML = "🎉 <span style='color:#27ae60'>太棒了！你準時到達公司！</span>";
                diceBtn.style.display = 'none';
                return;
            }

            if (cell.effect) {
                setTimeout(() => {
                    msgEl.innerText = cell.msg;
                    currentPos += cell.effect;
                    if (currentPos < 0) currentPos = 0;
                    initBoard();
                    diceBtn.disabled = false;
                }, 1300);
            } else {
                msgEl.innerText = "加油！距離公司越來越近了！";
                diceBtn.disabled = false;
            }
        }

        initBoard();
    </script>
</body>
</html>
