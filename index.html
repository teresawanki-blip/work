<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面試挑戰 - 準時到達 30格</title>
    <style>
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            text-align: center; margin: 0; padding: 10px;
            background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), 
                        url('https://images.unsplash.com');
            background-size: cover; background-attachment: fixed;
        }

        /* 遊戲玩法區 */
        #how-to-play {
            background: rgba(255, 255, 255, 0.9); border: 2px solid #2ecc71;
            border-radius: 15px; padding: 15px; max-width: 800px; margin: 10px auto;
            text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #how-to-play h3 { margin-top: 0; color: #27ae60; }
        #how-to-play ul { margin: 5px 0; padding-left: 20px; font-size: 18px; line-height: 1.6; }

        /* 時鐘與儀表板 */
        #dashboard {
            display: flex; justify-content: center; align-items: center;
            gap: 30px; margin: 20px auto;
        }
        #timer {
            font-size: 32px; background: #2c3e50; color: #f1c40f;
            padding: 15px 30px; border-radius: 50px; border: 4px solid #f1c40f;
            font-family: 'Courier New', Courier, monospace; font-weight: bold;
        }

        /* 30格棋盤：6行 x 5列 */
        #board { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; 
            max-width: 850px; margin: 0 auto 20px; 
        }
        .cell { 
            height: 90px; border: 3px solid #bdc3c7; background: rgba(255, 255, 255, 0.95); 
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; position: relative; transition: 0.3s;
        }
        .cell-num { position: absolute; top: 3px; left: 5px; font-size: 14px; color: #7f8c8d; }
        .active { border-color: #f1c40f; background-color: #fff9c4; box-shadow: 0 0 20px #f1c40f; transform: scale(1.05); z-index: 5; }
        .event-good { border-color: #3498db; background-color: #e1f5fe; }
        .event-bad { border-color: #e74c3c; background-color: #ffebee; }
        
        #player { font-size: 45px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3)); }
        
        #dice-btn { 
            padding: 20px 60px; font-size: 32px; cursor: pointer; 
            background: #27ae60; color: white; border: none; border-radius: 60px; 
            box-shadow: 0 8px #1e8449;
        }
        #dice-btn:disabled { background: #bdc3c7; box-shadow: none; cursor: not-allowed; }

        #msg { 
            font-size: 24px; margin: 20px auto; min-height: 50px; font-weight: bold;
            max-width: 700px; padding: 15px; border-radius: 15px; background: white;
            border: 3px solid #3498db;
        }
        .icon { font-size: 35px; }
    </style>
</head>
<body>

    <h1>🏙️ 面試大挑戰：不要遲到！ 🏢</h1>

    <!-- 1. 遊戲玩法 -->
    <div id="how-to-play">
        <h3>💡 遊戲玩法：</h3>
        <ul>
            <li>🎯 點擊<b>「🎲 擲骰子」</b>前進。</li>
            <li>⏳ 每走一格，時鐘會扣除 <b>5 分鐘</b>。</li>
            <li>🏢 你的目標：在時間變為 <b>00:00</b> 前到達終點。</li>
            <li>⚠️ 記得帶齊法寶，避開塞車，否則會遲到喔！</li>
        </ul>
    </div>

    <!-- 2. 時鐘顯示 -->
    <div id="dashboard">
        <div id="timer">剩餘時間：01:15</div>
    </div>

    <div id="game-container">
        <div id="board"></div>
    </div>

    <button id="dice-btn" onclick="rollDice()">🎲 擲骰子</button>
    <div id="msg">面試快要開始了，快出發吧！</div>

    <script>
        // 設定 30 格內容
        const rawData = [
            { label: "起點", icon: "🏠" },
            { label: "帶齊證件", icon: "🪪", effect: 1, msg: "好棒！帶齊證件，快咗 1 格！" },
            { label: "", icon: "👣" },
            { label: "睇地圖", icon: "🗺️", effect: 1, msg: "識睇地圖，快咗 1 格！" },
            { label: "", icon: "👣" },
            { label: "塞車", icon: "🚗", effect: -1, msg: "塞車啦！慢咗 1 格。" },
            { label: "", icon: "👣" },
            { label: "早出發", icon: "☀️", effect: 2, msg: "提早出門，行快 2 格！" },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "漏帶相片", icon: "📸", effect: -2, msg: "唔記得帶相！要返屋企攞。" },
            { label: "", icon: "👣" },
            { label: "衣服整齊", icon: "👔", effect: 1, msg: "衣服整齊，面試加分！前進 1 格。" },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "交通燈紅燈", icon: "🚦", effect: -1, msg: "等紅燈，慢咗 1 格。" },
            { label: "", icon: "👣" },
            { label: "查好路線", icon: "🚌", effect: 1, msg: "查好巴士路線，快咗 1 格！" },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "電話冇電", icon: "🪫", effect: -1, msg: "電話冇電睇唔到地圖，慢咗 1 格。" },
            { label: "", icon: "👣" },
            { label: "飲啖水", icon: "🥛", effect: 0, msg: "飲啖水，放鬆心情。" },
            { label: "", icon: "👣" },
            { label: "見到公司", icon: "🏙️", effect: 2, msg: "見到公司大樓啦！衝刺 2 格！" },
            { label: "", icon: "👣" },
            { label: "落大雨", icon: "🌧️", effect: -2, msg: "落大雨要避雨，慢咗 2 格。" },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "終點", icon: "🏢", isEnd: true }
        ];

        // 30 格 S 型排列 (6行 x 5列)
        const sCurveIndex =;

        let currentPos = 0;
        let totalMinutes = 75; // 1小時15分鐘
        const boardEl = document.getElementById('board');
        const msgEl = document.getElementById('msg');
        const timerEl = document.getElementById('timer');
        const diceBtn = document.getElementById('dice-btn');

        function updateTimerDisplay() {
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            timerEl.innerText = `剩餘時間：${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            if (totalMinutes <= 0) {
                timerEl.style.color = "#e74c3c";
                gameOver("遲到了！面試已經結束了。下次要快點喔！");
            }
        }

        function initBoard() {
            boardEl.innerHTML = '';
            sCurveIndex.forEach((dataIndex) => {
                const cell = rawData[dataIndex];
                const div = document.createElement('div');
                div.className = 'cell';
                if (cell.effect > 0) div.classList.add('event-good');
                if (cell.effect < 0) div.classList.add('event-bad');
                
                div.innerHTML = `
                    <div class="cell-num">${dataIndex + 1}</div>
                    <div class="icon">${cell.icon}</div>
                    <div style="font-size:12px">${cell.label}</div>
                `;
                
                if (dataIndex === currentPos) {
                    div.classList.add('active');
                    const player = document.createElement('div');
                    player.id = 'player';
                    player.innerText = '🙋‍♂️';
                    div.appendChild(player);
                }
                boardEl.appendChild(div);
            });
        }

        function rollDice() {
            diceBtn.disabled = true;
            const steps = Math.floor(Math.random() * 3) + 1; 
            msgEl.innerText = `🎲 擲到 ${steps} 點！準備行...`;
            
            let moveCount = 0;
            const moveInterval = setInterval(() => {
                if (moveCount < steps && currentPos < rawData.length - 1 && totalMinutes > 0) {
                    currentPos++;
                    moveCount++;
                    totalMinutes -= 5; // 每走一格扣5分鐘
                    updateTimerDisplay();
                    initBoard();
                    
                    if (totalMinutes <= 0) {
                        clearInterval(moveInterval);
                        gameOver("時間用完了！你遲到了。");
                    }
                } else {
                    clearInterval(moveInterval);
                    if (totalMinutes > 0) checkEvent();
                }
            }, 600);
        }

        function checkEvent() {
            const cell = rawData[currentPos];
            if (cell.isEnd) {
                msgEl.innerHTML = "<span style='color:#27ae60'>🎉 太棒了！你在限時內準時到達！面試成功！</span>";
                diceBtn.style.display = 'none';
                return;
            }

            if (cell.effect) {
                setTimeout(() => {
                    msgEl.innerText = cell.msg;
                    // 因事件移動不額外扣時間，或按需求修改
                    currentPos += cell.effect;
                    if (currentPos < 0) currentPos = 0;
                    initBoard();
                    diceBtn.disabled = false;
                }, 1000);
            } else {
                msgEl.innerText = "繼續努力，就快到公司啦！";
                diceBtn.disabled = false;
            }
        }

        function gameOver(message) {
            msgEl.innerHTML = `<span style='color:#e74c3c'>❌ ${message}</span>`;
            diceBtn.disabled = true;
            diceBtn.innerText = "遊戲結束";
        }

        updateTimerDisplay();
        initBoard();
    </script>
</body>
</html>
