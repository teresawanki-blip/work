<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面試康樂棋 - 15格版</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; text-align: center; background-color: #f7f9fc; margin: 0; padding: 10px; }
        h1 { color: #2c3e50; font-size: 26px; margin: 10px 0; }
        #game-container { max-width: 750px; margin: auto; position: relative; }
        #board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .cell { height: 110px; border: 4px solid #bdc3c7; background: white; border-radius: 15px; 
                display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .cell-num { position: absolute; top: 5px; left: 8px; font-size: 16px; color: #95a5a6; }
        .active { border-color: #f1c40f; background-color: #fffde7; box-shadow: 0 0 20px #f1c40f; z-index: 5; }
        .event-good { background-color: #e3f2fd; border-color: #2196f3; }
        .event-bad { background-color: #ffebee; border-color: #f44336; }
        #player { font-size: 50px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #dice-btn { padding: 18px 40px; font-size: 28px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 50px; box-shadow: 0 6px #1e8449; }
        #dice-btn:disabled { background: #bdc3c7; box-shadow: none; }
        #msg { font-size: 24px; margin: 20px auto; min-height: 50px; color: #2c3e50; font-weight: bold; max-width: 600px; padding: 10px; border-radius: 10px; background: white; border: 2px dashed #bdc3c7; }
        .icon { font-size: 40px; }
    </style>
</head>
<body>

    <h1>🚶 面試大冒險 (康樂棋) 🏢</h1>

    <div id="game-container">
        <div id="board">
            <!-- 15格由 JavaScript 產生 -->
        </div>
    </div>

    <button id="dice-btn" onclick="rollDice()">🎲 擲骰子</button>
    <div id="msg">請點擊綠色按鈕開始！</div>

    <script>
        // 定義 15 格的內容
        const rawData = [
            { label: "起點", icon: "🏠" },
            { label: "帶齊證件", icon: "🪪", effect: 1, msg: "好棒！帶齊證件，行快 1 格！" },
            { label: "", icon: "👣" },
            { label: "睇地圖", icon: "🗺️", effect: 1, msg: "識睇地圖，行快 1 格！" },
            { label: "", icon: "👣" },
            { label: "塞車", icon: "🚗", effect: -1, msg: "前面塞車，要退後 1 格。" },
            { label: "", icon: "👣" },
            { label: "早出發", icon: "☀️", effect: 2, msg: "提早出門，好準時，行快 2 格！" },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "漏帶相片", icon: "📸", effect: -2, msg: "唔記得帶相！要退後 2 格攞返。" },
            { label: "", icon: "👣" },
            { label: "整理衣服", icon: "👔", effect: 1, msg: "衣服整齊，面試加分！行快 1 格。" },
            { label: "", icon: "👣" },
            { label: "終點", icon: "🏢", isEnd: true }
        ];

        // 康樂棋 S 型排列邏輯 (5x3)
        // 第一行: 0,1,2,3,4 (右)
        // 第二行: 9,8,7,6,5 (左)
        // 第三行: 10,11,12,13,14 (右)
        const sCurveIndex = [0, 1, 2, 3, 4, 9, 8, 7, 6, 5, 10, 11, 12, 13, 14];

        let currentPos = 0;
        const boardEl = document.getElementById('board');
        const msgEl = document.getElementById('msg');
        const diceBtn = document.getElementById('dice-btn');

        function initBoard() {
            boardEl.innerHTML = '';
            sCurveIndex.forEach((dataIndex, displayOrder) => {
                const cell = rawData[dataIndex];
                const div = document.createElement('div');
                div.className = 'cell';
                div.id = `cell-${dataIndex}`;
                
                if (cell.effect > 0) div.classList.add('event-good');
                if (cell.effect < 0) div.classList.add('event-bad');
                
                div.innerHTML = `
                    <div class="cell-num">${dataIndex + 1}</div>
                    <div class="icon">${cell.icon}</div>
                    <div style="font-size:14px">${cell.label}</div>
                `;
                
                if (dataIndex === currentPos) {
                    div.classList.add('active');
                    const player = document.createElement('div');
                    player.id = 'player';
                    player.innerText = '🙋‍♂️';
                    div.appendChild(player);
                }
                boardEl.appendChild(div);
            });
        }

        function rollDice() {
            diceBtn.disabled = true;
            const steps = Math.floor(Math.random() * 3) + 1; 
            msgEl.innerText = `擲到 ${steps} 點！預備...走！`;
            
            let moveCount = 0;
            const moveInterval = setInterval(() => {
                if (moveCount < steps && currentPos < rawData.length - 1) {
                    currentPos++;
                    moveCount++;
                    initBoard();
                } else {
                    clearInterval(moveInterval);
                    checkEvent();
                }
            }, 700); // 稍微調慢移動速度，讓學生看清楚路徑
        }

        function checkEvent() {
            const cell = rawData[currentPos];
            if (cell.isEnd) {
                msgEl.innerText = "🎉 太棒了！你成功到達公司面試！";
                diceBtn.style.display = 'none';
                return;
            }

            if (cell.effect) {
                setTimeout(() => {
                    msgEl.innerText = cell.msg;
                    currentPos += cell.effect;
                    if (currentPos < 0) currentPos = 0;
                    initBoard();
                    diceBtn.disabled = false;
                }, 1200);
            } else {
                msgEl.innerText = "加油！離公司越來越近了！";
                diceBtn.disabled = false;
            }
        }

        initBoard();
    </script>
</body>
</html>
