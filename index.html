<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面試大挑戰 - 無限循環修正版</title>
    <style>
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            text-align: center; margin: 0; padding: 10px;
            background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), 
                        url('https://images.unsplash.com');
            background-size: cover; background-attachment: fixed;
        }
        #how-to-play {
            background: rgba(255, 255, 255, 0.9); border: 2px solid #3498db;
            border-radius: 15px; padding: 15px; max-width: 850px; margin: 10px auto;
            text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #how-to-play h3 { margin-top: 0; color: #2980b9; }
        #how-to-play ul { margin: 5px 0; padding-left: 20px; font-size: 18px; line-height: 1.6; }
        #dashboard { display: flex; justify-content: center; align-items: center; gap: 30px; margin: 15px auto; }
        #target-time { font-size: 24px; background: #ecf0f1; padding: 10px 20px; border-radius: 10px; border: 2px solid #bdc3c7; }
        #current-time {
            font-size: 36px; background: #2c3e50; color: #f1c40f;
            padding: 15px 40px; border-radius: 50px; border: 4px solid #f1c40f;
            font-family: 'Courier New', Courier, monospace; font-weight: bold;
        }
        #board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 850px; margin: 0 auto 20px; }
        .cell { 
            height: 85px; border: 3px solid #bdc3c7; background: rgba(255, 255, 255, 0.95); 
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; position: relative; transition: 0.3s;
        }
        .cell-num { position: absolute; top: 3px; left: 5px; font-size: 13px; color: #7f8c8d; }
        .active { border-color: #f1c40f; background-color: #fff9c4; box-shadow: 0 0 20px #f1c40f; transform: scale(1.05); z-index: 5; }
        .event-good { border-color: #3498db; background-color: #e1f5fe; }
        .event-bad { border-color: #e74c3c; background-color: #ffebee; }
        #player { font-size: 45px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3)); }
        #dice-btn { padding: 20px 60px; font-size: 32px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 60px; box-shadow: 0 8px #1e8449; }
        #dice-btn:disabled { background: #bdc3c7; box-shadow: none; cursor: not-allowed; }
        #msg { font-size: 24px; margin: 20px auto; min-height: 60px; font-weight: bold; max-width: 750px; padding: 15px; border-radius: 15px; background: white; border: 3px solid #3498db; }
        .icon { font-size: 32px; }
    </style>
</head>
<body>

    <h1>🏙️ 面試大挑戰：尋找「黃金時間」 🏢</h1>

    <div id="how-to-play">
        <h3>💡 遊戲目標：</h3>
        <ul>
            <li>🚩 面試時間是 <span style="color:#e67e22; font-weight:bold;">10:00</span>。</li>
            <li>⌚ 最好在 <span style="color:#27ae60; font-weight:bold;">09:45 - 10:00</span> 之間到達。</li>
            <li>🕒 <b>每一格過 4 分鐘</b>。如果曾經退後，下次經過同一格會直接通過！</li>
        </ul>
    </div>

    <div id="dashboard">
        <div id="target-time">🎯 面試時間：10:00</div>
        <div id="current-time">現在時間：08:00</div>
    </div>

    <div id="board"></div>

    <button id="dice-btn" onclick="rollDice()">🎲 擲骰子</button>
    <div id="msg">現在是 08:00，準備出發！</div>

    <script>
        const rawData = [
            { label: "起點", icon: "🏠" },
            { label: "帶齊證件", icon: "🪪", effect: 1, msg: "好棒！帶齊證件，行快咗！" },
            { label: "", icon: "👣" },
            { label: "睇地圖", icon: "🗺️", effect: 1, msg: "識睇地圖，行快咗！" },
            { label: "", icon: "👣" },
            { label: "塞車", icon: "🚗", effect: -1, msg: "塞車啦！慢咗一步。", isTrap: true },
            { label: "", icon: "👣" },
            { label: "早出發", icon: "☀️", effect: 2, msg: "提早出門，行快 2 格！" },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "漏帶相片", icon: "📸", effect: -3, msg: "唔記得帶相！要返屋企攞。", isTrap: true },
            { label: "衣服整齊", icon: "👔", effect: 1, msg: "衣服整齊，面試加分！" },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "紅燈", icon: "🚦", effect: -1, msg: "等紅燈，慢咗一步。", isTrap: true },
            { label: "", icon: "👣" },
            { label: "查好路線", icon: "🚌", effect: 1, msg: "查好巴士路線，行得好順！" },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "電話冇電", icon: "🪫", effect: -1, msg: "電話冇電，行慢咗。", isTrap: true },
            { label: "", icon: "👣" },
            { label: "喝水放鬆", icon: "🥛", effect: 0, msg: "喝口水，深呼吸。" },
            { label: "", icon: "👣" },
            { label: "見到公司", icon: "🏙️", effect: 2, msg: "見到公司大樓啦！快步走！" },
            { label: "", icon: "👣" },
            { label: "落大雨", icon: "🌧️", effect: -2, msg: "落大雨，要慢行。", isTrap: true },
            { label: "", icon: "👣" },
            { label: "", icon: "👣" },
            { label: "終點", icon: "🏢", isEnd: true }
        ];

        const sCurveIndex =;
        let currentPos = 0;
        let currentTimeMinutes = 480; 
        
        // 使用 Set 來紀錄已經中過招的格子編號
        let encounteredTraps = new Set(); 

        const boardEl = document.getElementById('board');
        const msgEl = document.getElementById('msg');
        const timerEl = document.getElementById('current-time');
        const diceBtn = document.getElementById('dice-btn');

        function updateTimeDisplay() {
            const h = Math.floor(currentTimeMinutes / 60);
            const m = currentTimeMinutes % 60;
            timerEl.innerText = `現在時間：${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            if (currentTimeMinutes > 600) timerEl.style.color = "#e74c3c";
        }

        function initBoard() {
            boardEl.innerHTML = '';
            sCurveIndex.forEach((idx) => {
                const cell = rawData[idx];
                const div = document.createElement('div');
                div.className = 'cell';
                if (cell.effect > 0) div.classList.add('event-good');
                if (cell.effect < 0) div.classList.add('event-bad');
                div.innerHTML = `<div class="cell-num">${idx + 1}</div><div class="icon">${cell.icon}</div><div style="font-size:11px">${cell.label}</div>`;
                if (idx === currentPos) {
                    div.classList.add('active');
                    const p = document.createElement('div'); p.id = 'player'; p.innerText = '🙋‍♂️';
                    div.appendChild(p);
                }
                boardEl.appendChild(div);
            });
        }

        function rollDice() {
            diceBtn.disabled = true;
            const steps = Math.floor(Math.random() * 3) + 1; 
            msgEl.innerText = `🎲 擲到 ${steps} 點！`;
            let moveCount = 0;
            const moveInterval = setInterval(() => {
                if (moveCount < steps && currentPos < rawData.length - 1) {
                    currentPos++; moveCount++;
                    currentTimeMinutes += 4; 
                    updateTimeDisplay(); initBoard();
                } else {
                    clearInterval(moveInterval);
                    checkEvent();
                }
            }, 600);
        }

        function checkEvent() {
            const cell = rawData[currentPos];
            if (cell.isEnd) { judgeResult(); return; }

            // 全局保底邏輯：如果這個格子編號曾經讓玩家退後過，這次就直接跳過
            if (cell.isTrap && encounteredTraps.has(currentPos)) {
                msgEl.innerText = "上次已經解決咗問題，繼續行！";
                diceBtn.disabled = false;
                return;
            }

            if (cell.effect !== undefined && cell.effect !== 0) {
                setTimeout(() => {
                    msgEl.innerText = cell.msg;
                    // 如果是後退事件，將其加入「已中招」名單
                    if (cell.effect < 0) {
                        encounteredTraps.add(currentPos);
                    }
                    currentPos += cell.effect;
                    if (currentPos < 0) currentPos = 0;
                    initBoard(); diceBtn.disabled = false;
                }, 1000);
            } else { diceBtn.disabled = false; }
        }

        function judgeResult() {
            diceBtn.style.display = 'none';
            if (currentTimeMinutes >= 585 && currentTimeMinutes <= 600) {
                msgEl.innerHTML = "<span style='color:#27ae60'>🌟 太棒了！你在黃金時間到達！你是最準時的！</span>";
            } else if (currentTimeMinutes < 585) {
                msgEl.innerHTML = "<span style='color:#2980b9'>⚠️ 到達終點！但現在太早了，要在門口等很久。</span>";
            } else {
                msgEl.innerHTML = "<span style='color:#e74c3c'>❌ 遲到了！已經超過 10:00。</span>";
            }
        }

        updateTimeDisplay();
        initBoard();
    </script>
</body>
</html>
